# Builds an unsigned NovaPlay.ipa on a cloud Mac. Sideloadly or AltStore signs it with your Apple ID when installing.
name: iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    # Intel Macs: GitHub's Apple-chip Macs are often too busy to start a job. The .ipa is built for iPhones either way.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Tools
        run: |
          chmod +x gradlew
          brew install xcodegen
          # Android is not built here; an empty SDK path keeps Gradle from looking for one.
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Xcode project
        working-directory: iosApp
        run: |
          xcodegen generate
          pod install

      - name: Build
        working-directory: iosApp
        run: |
          xcodebuild -workspace NovaPlay.xcworkspace -scheme NovaPlay -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Check image decoding isn't bound to VLCKit
        working-directory: iosApp
        run: |
          # Skia must use its own libpng: one bound to VLCKit's copy crashes on the first channel logo.
          BIN=build/Build/Products/Release-iphoneos/NovaPlay.app/NovaPlay
          if nm -m "$BIN" | grep -E "\(undefined\).*_png_" | grep -i vlckit; then
            echo "::error::png functions are taken from VLCKit (see OTHER_LDFLAGS order in project.yml)"
            exit 1
          fi
          echo "png functions: not from VLCKit"

      - name: Package the .ipa
        working-directory: iosApp
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NovaPlay.app Payload/
          zip -qry NovaPlay.ipa Payload
          ls -la NovaPlay.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-ipa
          path: iosApp/NovaPlay.ipa
          retention-days: 30

  # Starts the app in the iPhone Simulator, saves screenshots and fails if it crashes: a check before the .ipa is
  # released. It has no playlist, so it covers start-up and the first screens, not playback.
  simulator:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Tools
        run: |
          chmod +x gradlew
          brew install xcodegen
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Xcode project
        working-directory: iosApp
        run: |
          xcodegen generate
          pod install

      - name: Build for the Simulator
        working-directory: iosApp
        run: |
          xcodebuild -workspace NovaPlay.xcworkspace -scheme NovaPlay -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Run and screenshot
        working-directory: iosApp
        run: |
          mkdir -p shots
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-7]( Pro)? \(" | grep -oE "[0-9A-F-]{36}")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=build/Build/Products/Debug-iphonesimulator/NovaPlay.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch --console-pty "$DEVICE" "$BUNDLE" > shots/console.log 2>&1 &
          for t in 5 15 30; do
            sleep $([ $t = 5 ] && echo 5 || echo 10)
            xcrun simctl io "$DEVICE" screenshot "shots/after-${t}s.png"
          done
          # Still running after 30 s, or it crashed.
          if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE"; then
            echo "::error::NovaPlay is not running in the Simulator: it crashed or quit. See crash.txt and system.log."
            # Kotlin's exception and Apple's crash report, to see where it stopped.
            xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "NovaPlay"' > shots/system.log 2>&1 || true
            sleep 5
            for f in ~/Library/Logs/DiagnosticReports/NovaPlay*; do [ -f "$f" ] && cp "$f" shots/; done
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5 > shots/reports.txt
            grep -h -A40 -E "Uncaught Kotlin exception|Exception Type|Termination Reason|crashed" shots/system.log shots/NovaPlay* 2>/dev/null | head -120 > shots/crash.txt || true
            cat shots/crash.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaPlay-simulator
          path: iosApp/shots
          retention-days: 14
